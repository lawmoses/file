name: one-time YouTube thumbnail copy for preview (self-removing)
on:
  push:
    paths: ['.github/workflows/yt-thumbs.yml']
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download thumbnails
        run: |
          mkdir -p check/yt
          : > check/yt/report.txt
          while read -r u; do
            [ -z "$u" ] && continue
            id=$(echo "$u" | sed -E 's#.*/vi/([^/]+)/([a-z]+)\.jpg#\1-\2#')
            r=$(curl -s -L -o "check/yt/$id.jpg" -w "%{http_code} %{content_type} %{size_download}" --max-time 60 "$u")
            echo "$r $u" >> check/yt/report.txt
          done < .yt-urls.txt
      - name: Commit and remove this workflow
        run: |
          git config user.name "lawmoses"
          git config user.email "lawmosese1@gmail.com"
          git rm -q .github/workflows/yt-thumbs.yml .yt-urls.txt
          git add check/yt
          git commit -q -m "YouTube thumbnails for local preview (workflow removed)"
          git push -q
