name: one-time jsDelivr check (self-removing)
on:
  push:
    paths: ['.github/workflows/jsd-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every URL from jsDelivr
        run: |
          mkdir -p check
          : > check/jsd-report.txt
          while read -r u; do
            [ -z "$u" ] && continue
            r=""
            for i in 1 2 3; do
              r=$(curl -s -L -o /dev/null -w "%{http_code} %{content_type} %{size_download}" --max-time 60 "$u")
              case "$r" in 200\ image/*) break;; esac
              sleep 3
            done
            echo "$r $u" >> check/jsd-report.txt
          done < .jsd-urls.txt
          echo "total $(wc -l < check/jsd-report.txt) ok $(grep -c '^200 image/' check/jsd-report.txt)" | tee -a check/jsd-report.txt
      - name: Commit report and remove this workflow
        run: |
          git config user.name "lawmoses"
          git config user.email "lawmosese1@gmail.com"
          git rm -q .github/workflows/jsd-check.yml .jsd-urls.txt
          git add check/jsd-report.txt
          git commit -q -m "jsDelivr check report (workflow removed)"
          git push -q
